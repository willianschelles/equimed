# Quality gate for pull requests: build, SEO audit of the build, Lighthouse CI.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tailwind CSS CLI (standalone, pinned)
        run: tools/setup-tailwind.sh
      - run: npm run build
      - name: SEO audit (build)
        run: node tools/seo-audit.mjs --dir dist --strict --out seo-report.md
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            seo-report.md
            .lighthouseci
          if-no-files-found: ignore
