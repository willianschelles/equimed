# Builds the site and publishes dist/ to GitHub Pages on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (project-path preview until publishCname is true)
        run: |
          export BASE_PATH=$(node -p "require('./content/site.json').publishCname ? '' : '/${{ github.event.repository.name }}'")
          npm run build
      - name: SEO audit of the build (skipped for the project-path preview: links are rebased)
        run: node -e "process.exit(require('./content/site.json').publishCname ? 0 : 0)" && if [ "$(node -p "require('./content/site.json').publishCname")" = "true" ]; then npm run check:seo; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
